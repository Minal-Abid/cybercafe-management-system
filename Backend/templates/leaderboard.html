<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard - CyberCafe</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script type="module" src="/static/main.js"></script>
</head>
<body>
  <div id="main-app" class="screen active">
    <!-- Navbar -->
    <nav id="navbar" class="navbar">
      <div class="navbar-container">
        <div class="navbar-left">
          <div class="navbar-brand">
            <!-- ✅ replaced shield with logo -->
            <img src="/static/cyber.png" alt="CyberCafe Logo" class="navbar-brand" />
          </div>
          
          <div class="navbar-nav">
            <button id="nav-dashboard" class="nav-button">
             
              <span class="navbar-title">Dashboard</span>
            </button>
            <button class="nav-button active">
              
              <span class="navbar-title">Leaderboard</span>
            </button>
          </div>
        </div>
      </div>
                <div class="title-divider"></div>

    </nav>

    <!-- Leaderboard Content -->
    <div id="leaderboard" class="view active">
      <div class="leaderboard-background">
        <div class="bg-element bg-element-1"></div>
        <div class="bg-element bg-element-2"></div>
      </div>

      <div class="leaderboard-container">
        <div class="leaderboard-header">
          <h1 class="leaderboard-title">Leaderboard</h1>
          <p class="leaderboard-subtitle">See how you rank among the cybersecurity elite</p>
        </div>

        <div class="leaderboard-filters">
          <button class="filter-button active" data-filter="all">All Users</button>
          <button class="filter-button" data-filter="free">Free Tier</button>
          <button class="filter-button" data-filter="premium">Premium</button>
        </div>

        <div id="leaderboard-list" class="leaderboard-list">
          <!-- Leaderboard entries will be populated here -->
        </div>

        <div id="user-stats" class="user-stats-card glass">
          <h3 class="user-stats-title">Your Stats</h3>
          <div class="user-stats-grid">
            <div class="user-stat">
              <div id="user-rank" class="user-stat-value">#1</div>
              <div class="user-stat-label">Current Rank</div>
            </div>
            <div class="user-stat">
              <div id="user-total-score" class="user-stat-value">0</div>
              <div class="user-stat-label">Total Points</div>
            </div>
            <div class="user-stat">
              <div id="user-challenges-solved" class="user-stat-value">0</div>
              <div class="user-stat-label">Challenges Solved</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation Logic -->
  <script>
    document.getElementById('nav-dashboard')?.addEventListener('click', () => {
      window.location.href = '/dashboard';
    });
  </script>
    <script type="module" src="/static/modules/leaderboard.js"></script>

</body>
</html>
